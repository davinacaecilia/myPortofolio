<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Davina</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/about.css">
    <link rel="stylesheet" href="css/skills.css">
    <link rel="stylesheet" href="css/projects.css">
    <link rel="stylesheet" href="css/experience.css">
    <link rel="stylesheet" href="css/contact.css">
</head>

<body>
    <div class="decor decor-1">✦</div>
    <div class="decor decor-2">♡</div>
    <div class="decor decor-3">✿</div>
    <div class="decor decor-4">✧</div>
    <div class="decor decor-5">♡</div>

    <div id="navbar"></div>

    <main>
        <div id="home"></div>
        <div id="about"></div>
        <div id="skills"></div>
        <div id="projects"></div>
        <div id="experience"></div>
        <div id="contact"></div>
    </main>

    <div id="footer"></div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
        <div class="lightbox-content">
            <button class="lightbox-close" onclick="closeLightbox()">×</button>
            <img src="" alt="" class="lightbox-image" id="lightboxImage">
            <p class="lightbox-caption" id="lightboxCaption"></p>
        </div>
    </div>

    <script src="js/navbar.js"></script>
    <script src="js/projects.js"></script>
    <script src="js/experience.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
