<section id="projects" class="section">
    <div class="section-heading reveal">
        <div>
            <p class="eyebrow">things i've built</p>
            <h2>My <span>Projects</span> ✦</h2>
        </div>
    </div>

    <div class="project-tabs reveal">
        <button class="project-tab active" data-category="web">
            <span>⌘</span>Web Application
        </button>

        <button class="project-tab" data-category="uiux">
            <span>✦</span>UI / UX Design
        </button>
    </div>

    <div class="project-carousel reveal">
        <button class="carousel-button prev-button" id="prevProject" aria-label="Previous project">←</button>
        <div class="project-display">
            <div class="project-image-wrapper">
                <div class="project-image project-pink" id="projectImage">
                    <img id="projectImageContent" src="" alt="Project preview">
                    <span class="project-label" id="projectNumber">01</span>
                </div>
            </div>

            <div class="project-information">
                <p class="project-type" id="projectType"></p>
                <h3 id="projectTitle"></h3>
                <p id="projectDescription"></p>
                <div class="project-tags" id="projectTags"></div>
                <a href="#" class="project-link" id="projectLink">view project →</a>
            </div>
        </div>
        <button class="carousel-button next-button" id="nextProject" aria-label="Next project">→</button>
    </div>

    <div class="carousel-bottom reveal">
        <span id="projectCounter">1 / 3</span>
        <div class="carousel-dots" id="carouselDots">
            <button class="carousel-dot active"></button>
            <button class="carousel-dot"></button>
            <button class="carousel-dot"></button>
        </div>
    </div>
</section>
